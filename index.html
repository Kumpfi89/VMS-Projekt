<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smartbox Management</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <!-- HTML5 QR Code Library -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <!-- App Script -->
  <script src="app.js" defer></script>
</head>
<body>
  <div class="container">
    <h1>💊 Smartbox Dashboard</h1>

    <!-- Profilauswahl -->
    <div class="card profile-section">
      <h3>Profil verwalten</h3>
      <div class="input-group">
        <input type="text" id="user-profile-input" placeholder="Profilname (z. B. Sebi)">
        <button id="btn-load-profile">Profil laden</button>
      </div>
      <p>Aktives Profil: <strong id="active-profile-name">Sebi</strong></p>
    </div>

    <!-- Scanner & Eingabe Aktionen -->
    <div class="card scan-section">
      <h3>Präparat hinzufügen</h3>
      
      <div class="button-group">
        <button id="btn-start-scan">📷 Barcode Scannen</button>
        <button id="btn-ocr-scan">🖼️ Foto / OCR Zahl</button>
        <button id="btn-manual-entry">✏️ Manuell Eingeben</button>
      </div>

      <!-- Versteckter File-Input für das OCR-Foto -->
      <input type="file" id="ocr-file-input" accept="image/*" class="hidden">

      <!-- Reader Container für Kamera Feed -->
      <div id="reader-container" class="hidden">
        <div id="reader"></div>
        <!-- Element für den nativen Video-Stream -->
        <video id="native-video" playsinline class="hidden" style="width: 100%; border-radius: 8px; background: #000;"></video>
        <button id="btn-stop-scan" class="btn-danger">Kamera Schließen</button>
      </div>

      <!-- Scan Erfassungs-Ergebnis -->
      <div id="scan-result" class="hidden">
        <h4>Erkanntes Produkt:</h4>
        <p id="product-name">-</p>
        <button id="btn-edit-name" class="btn-small">✏️ Name anpassen</button>

        <div class="slot-selection">
          <label for="slot-select">Behälter auswählen:</label>
          <select id="slot-select">
            <option value="1">Behälter 1</option>
            <option value="2">Behälter 2</option>
            <option value="3">Behälter 3</option>
            <option value="4">Behälter 4</option>
          </select>
        </div>

        <div class="count-selection">
          <label for="pill-count">Anzahl (Stück):</label>
          <input type="number" id="pill-count" value="10" min="1">
        </div>

        <button id="btn-save-slot" class="btn-success">In Smartbox Speichern</button>
      </div>
    </div>

    <!-- Übersicht der 4 Slots -->
    <div class="card slots-overview">
      <h3>Behälter Übersicht</h3>
      <div class="slots-grid">
        
        <!-- Slot 1 -->
        <div class="slot-card empty-slot" id="slot-card-1">
          <div class="slot-header">
            <span>Behälter 1</span>
            <span class="led red" id="led-1"></span>
          </div>
          <div class="slot-body">
            <h4 id="name-1">Leer</h4>
            <p><span id="count-1">0</span> Stk.</p>
          </div>
          <button onclick="simulateTakePill(1)" class="btn-small">Entnahme (-1)</button>
        </div>

        <!-- Slot 2 -->
        <div class="slot-card empty-slot" id="slot-card-2">
          <div class="slot-header">
            <span>Behälter 2</span>
            <span class="led red" id="led-2"></span>
          </div>
          <div class="slot-body">
            <h4 id="name-2">Leer</h4>
            <p><span id="count-2">0</span> Stk.</p>
          </div>
          <button onclick="simulateTakePill(2)" class="btn-small">Entnahme (-1)</button>
        </div>

        <!-- Slot 3 -->
        <div class="slot-card empty-slot" id="slot-card-3">
          <div class="slot-header">
            <span>Behälter 3</span>
            <span class="led red" id="led-3"></span>
          </div>
          <div class="slot-body">
            <h4 id="name-3">Leer</h4>
            <p><span id="count-3">0</span> Stk.</p>
          </div>
          <button onclick="simulateTakePill(3)" class="btn-small">Entnahme (-1)</button>
        </div>

        <!-- Slot 4 -->
        <div class="slot-card empty-slot" id="slot-card-4">
          <div class="slot-header">
            <span>Behälter 4</span>
            <span class="led red" id="led-4"></span>
          </div>
          <div class="slot-body">
            <h4 id="name-4">Leer</h4>
            <p><span id="count-4">0</span> Stk.</p>
          </div>
          <button onclick="simulateTakePill(4)" class="btn-small">Entnahme (-1)</button>
        </div>

      </div>
    </div>
  </div>
</body>
</html>
